<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>seon pet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=Jua&display=swap">
<style>
/* Layout: one phone-width column. Top bar (menu / title / +), point strip, a stage where the cat sits in front of its house, action row below. */
:root{
  --bg:#e8eff2; --surface:#ffffff; --surface-2:#f2f7f9; --ink:#16222a; --muted:#5a6c76; --line:#cddae0;
  --accent:#1c8774; --accent-ink:#ffffff; --green:#2e9b4a; --green-ink:#ffffff; --coin:#f2b705; --coin-ink:#3a2a00; --danger:#cc3434; --ok:#1c8774;
  --shadow:0 6px 22px rgba(22,34,42,.12);
  --f-display:'Jua','Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --surface:#172228; --surface-2:#1e2c34; --ink:#e6f0f3; --muted:#93a7b1; --line:#2b3b44;
  --accent:#3ec1a7; --accent-ink:#06231d; --green:#4cc767; --green-ink:#052410; --danger:#ff7f7f; --ok:#3ec1a7; --shadow:0 6px 22px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --surface:#172228; --surface-2:#1e2c34; --ink:#e6f0f3; --muted:#93a7b1; --line:#2b3b44;
  --accent:#3ec1a7; --accent-ink:#06231d; --green:#4cc767; --green-ink:#052410; --danger:#ff7f7f; --ok:#3ec1a7; --shadow:0 6px 22px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.bar h1{text-align:center;font-size:26px;letter-spacing:.02em}
.icon-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.icon-btn.plus{background:var(--accent);border-color:var(--accent)}
.icon-btn.plus svg{stroke:var(--accent-ink)}

.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.coin{background:var(--coin);border-color:var(--coin);color:var(--coin-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* start + login */
.hero{padding:44px 8px 8px;text-align:center}
.hero h2{font-size:52px;line-height:1.05}
.hero p{margin:10px 0 0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px;font:inherit}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:8px;min-height:44px}

/* sorde */
.sorde{border:2px solid var(--ink);border-radius:20px;padding:18px;background:var(--surface)}
.sorde .tag{font-family:var(--f-display);font-size:30px;letter-spacing:.04em}
.big-mark{font-size:72px;line-height:1;color:var(--ok);font-family:var(--f-display)}
.big-mark.bad{color:var(--danger)}

/* points */
.points{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.points .lbl{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.points .num{font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.coin{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:16px;background:var(--coin);color:var(--coin-ink);font-weight:700;font-size:14px;padding:0 8px}
.deadline{font-size:13px;color:var(--muted);text-align:right;max-width:190px}
.deadline.warn{color:var(--danger);font-weight:700}

/* stage */
.stage{position:relative;aspect-ratio:1/.95;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.stage .ground{position:absolute;left:-10%;right:-10%;bottom:-18%;height:40%;border-radius:50%}
.stage .house{position:absolute;left:6%;width:88%;bottom:12%}
.stage .house svg{display:block;width:100%;height:auto}
.stage .cat{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:left 2.6s ease-in-out,width .4s;z-index:2}
.cat .flip{transition:transform .35s}
.cat .pose{position:relative;transform-origin:50% 100%}
.cat img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28))}
.cat .nose{position:absolute;left:58%;top:24%;width:20%;height:22%;border-radius:50%}
.cat.baby{bottom:3%}
.pose.pose.look{animation:look 1.7s ease-in-out}
@keyframes look{0%{transform:none}20%,75%{transform:rotate(-18deg) translateY(-8px) scale(1.05)}100%{transform:none}}
.pose.stretch{transform-origin:15% 100%;animation:stretch 2.8s ease-in-out}
@keyframes stretch{0%{transform:none}30%,70%{transform:scale(1.55,.8)}100%{transform:none}}
.pose.belly{animation:belly 2.6s ease-in-out}
@keyframes belly{0%{transform:none}25%{transform:scale(1.08,1.14)}50%{transform:scale(1.02,.97)}75%{transform:scale(1.15,1.22)}100%{transform:none}}
.pose.jump{animation:jump .65s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-100px) rotate(-8deg)}}
.rod{position:absolute;top:0;transform:translateX(-50%);z-index:3;transition:left 1.1s ease-in-out;pointer-events:none}
.rod .line{width:2px;height:92px;margin:0 auto;background:rgba(255,255,255,.9);box-shadow:0 0 2px rgba(0,0,0,.4)}
.rod .bill{width:74px;height:34px;margin:0 auto;border-radius:4px;border:2px solid #2d6a3e;background:linear-gradient(120deg,#9fd8a6,#5fae6f 55%,#9fd8a6);display:grid;place-items:center;color:#14391f;font-weight:700;font-size:12px;transform-origin:50% 0;animation:sway 1s ease-in-out infinite;box-shadow:0 4px 8px rgba(0,0,0,.3)}
@keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.toprow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toprow .btn{padding:8px 4px;min-height:44px;font-size:14px}
.btn.green{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.ball{width:168px;height:168px;border-radius:50%;border:0;margin:6px auto;background:radial-gradient(circle at 35% 30%,#fff7c2,#f2b705 55%,#c98a00);box-shadow:0 10px 24px rgba(0,0,0,.25);font-family:var(--f-display);font-size:24px;color:#3a2a00;animation:float 2.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pulse{animation:pulse 1.1s ease-in-out infinite;min-height:64px;font-size:20px}
@keyframes pulse{0%,100%{transform:scale(.88)}50%{transform:scale(1.25)}}
.red{color:var(--danger);font-weight:700}
.stage .cat img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28))}
.mission-btn{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pose.walking{animation:walk .5s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-6px) rotate(2.5deg)}}
.house-arrow{position:absolute;right:10px;bottom:38%;z-index:3;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.house-arrow svg{width:22px;height:22px;stroke:var(--bg);fill:none;stroke-width:2.6;stroke-linecap:round}
.house-arrow .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--coin);color:var(--coin-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.room{border-radius:18px;padding:14px;background:linear-gradient(#f3d9b1,#e2b887);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-height:160px;align-content:start}
.room .kit{border:0;border-radius:16px;background:rgba(255,255,255,.55);padding:8px;color:#3a2a14;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:13px}
.room .kit img{width:78%;height:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.room .kit b{font-family:var(--f-display);font-weight:400;font-size:16px}
.room .kit.warn{outline:3px solid var(--danger)}
.stage .house{transform-origin:50% 100%}
.stage .house.tumble{animation:tumble 2.4s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes tumble{0%{transform:none}25%{transform:rotate(7deg) translateX(8px)}100%{transform:translate(70%,55%) rotate(260deg);opacity:0}}
.rain{position:absolute;inset:0;z-index:5;background:rgba(20,32,48,.4);pointer-events:none;overflow:hidden}
.rain i{position:absolute;top:-30px;width:2px;height:22px;background:rgba(200,225,255,.85);animation:rainfall .55s linear infinite}
@keyframes rainfall{to{transform:translateY(400px)}}
.xmas{position:absolute;inset:0;z-index:0;pointer-events:none}
.xmas svg{width:100%;height:100%;display:block}
.xmas .b{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.snow{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;animation:snowfall linear infinite}
@keyframes snowfall{to{transform:translate(14px,380px)}}
.hand{position:absolute;z-index:6;width:62px;transform:translate(-50%,-100%) translateX(130px);opacity:0;transition:transform .6s ease-out,opacity .4s;pointer-events:none}
.hand svg{display:block;width:100%;transform:rotate(172deg)}
.hand.in{transform:translate(-50%,-100%);opacity:1}
.hand.stroke svg{animation:stroke .5s ease-in-out 3}
@keyframes stroke{0%,100%{transform:rotate(172deg) translateX(0)}50%{transform:rotate(172deg) translateX(-16px)}}
.hand.ouch svg{animation:ouch .35s linear 3;filter:drop-shadow(0 0 4px #ff3b3b) saturate(1.4)}
@keyframes ouch{0%,100%{transform:rotate(172deg) translateY(10px)}50%{transform:rotate(150deg) translateY(10px)}}
.say{position:absolute;z-index:7;transform:translateX(-50%);background:#fff;color:#c01818;font-family:var(--f-display);font-size:22px;padding:2px 12px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.pose.bite{animation:bite .3s linear 3}
@keyframes bite{0%,100%{transform:none}50%{transform:translateY(-12px) scale(1.05)}}
.pose.eat{animation:eat .55s ease-in-out infinite}
@keyframes eat{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg) translateY(5px)}}
.feed{position:absolute;bottom:2%;z-index:3;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end;animation:popin .35s ease-out}
@keyframes popin{from{transform:translateX(-50%) scale(.3);opacity:0}}
.feed .bowl{position:relative;width:62px}
.feed .bowl svg{display:block;width:100%}
.feed .kib{position:absolute;left:calc(30% + var(--x));top:0;width:8px;height:8px;border-radius:50%;background:#a5653a;animation:kib .8s ease-in var(--d) both}
@keyframes kib{from{transform:translateY(-120px);opacity:1}to{transform:translateY(12px);opacity:1}}
.pose.bounce{animation:bounce .45s}
@keyframes bounce{0%{transform:scale(1)}35%{transform:translateY(-14px) scale(1.06)}100%{transform:scale(1)}}
.heart{position:absolute;z-index:4;font-family:var(--f-display);font-size:26px;color:#ff5d8f;pointer-events:none;animation:floatUp 1.1s forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
.banner{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;text-align:center;font-weight:700}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:6px 14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface-2);border-radius:14px;padding:10px 6px}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.actions .btn{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25}
.actions .btn small{font-weight:400;color:var(--muted);font-size:12px}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.opts.one{grid-template-columns:minmax(0,220px);justify-content:center}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.opt svg,.opt img{width:100%;max-width:150px;height:auto}
.opt b{font-family:var(--f-display);font-weight:400;font-size:18px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,16,.55);z-index:20;display:flex}
.drawer{width:min(300px,84vw);background:var(--surface);height:100%;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.drawer .item{text-align:left;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:10px 16px;font-family:var(--f-display);font-size:22px}
.drawer .item.small{font-family:var(--f-body);font-size:15px;font-weight:700;min-height:46px}
.modal-wrap{align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:440px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.missions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mission{min-height:92px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);padding:10px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:center}
.mission b{font-family:var(--f-display);font-weight:400;font-size:20px}
.mission.done{opacity:.6;cursor:default}
.result{border-radius:18px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:6px}
.result h2{font-size:34px}
.result.win{background:var(--coin);color:var(--coin-ink)}
.result.bonus{background:var(--accent);color:var(--accent-ink)}
.result.fail{background:var(--surface-2);border:1px solid var(--line)}

.rules{color:var(--danger);font-weight:500;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:40;max-width:min(92vw,420px);text-align:center;font-weight:700;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden role="status"></div>

const pad = n=>String(n).padStart(2,'0');
const dayKey = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayNum = k=>{const [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const daysBetween = (a,b)=>dayNum(b)-dayNum(a);
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2200); }

function earn(n){ const a=acc(); a.pts+=n; a.lastEarn=dayKey(now()); save(); }
function spend(n){ const a=acc(); if(a.pts<n) return false; a.pts-=n; save(); return true; }

function petSize(p){ const d=Math.max(0,daysBetween(p.adopted,dayKey(now()))); return {cm:20+3*Math.floor(d/5), days:d, next:5-(d%5)}; }

/* Pets vanish when the 23:12 deadline of a day passes without any pet point earned that day. */
function checkVanish(){
  const a=acc(); if(!a||!a.pets.length) return false;
  const n=now(); const today=dayKey(n);
  const afterDeadline = n.getHours()>23 || (n.getHours()===23 && n.getMinutes()>=12);
  const y=new Date(n); y.setDate(y.getDate()-1);
  const D = afterDeadline ? today : dayKey(y);
  if(!a.lastEarn || a.lastEarn < D){ a.pets=[]; a.vanished=true; save(); return true; }
  return false;
}
function deadlineText(){
  const a=acc(), n=now(), today=dayKey(n);
  if(a.lastEarn===today) return {t:'오늘 펫 포인트를 이미 얻었어요', warn:false};
  const end=new Date(n); end.setHours(23,12,0,0);
  const ms=Math.max(0,end-n), h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4);
  return {t:`23:12까지 펫 포인트를 얻어야 해요 (${h}시간 ${m}분 남음)`, warn:ms<2*36e5};
}

const POS={};
function isXmas(){ const d=now(), m=d.getMonth()+1, day=d.getDate(); return (m===11&&day>=12)||m===12||(m===1&&day<=13); }
function xmasHtml(){
  const cols=['#ff4d4d','#ffd84d','#4db8ff','#6be07a'];
  const bulbs=[6,19,32,45,58,71,84,95].map((x,i)=>`<circle class="b" cx="${x}" cy="${i%2?11:8}" r="1.7" fill="${cols[i%4]}" style="animation-delay:${(i*.25).toFixed(2)}s"/>`).join('');
  const orn=[[10,52,'#ff4d4d'],[18,60,'#ffd84d'],[8,68,'#4db8ff'],[20,72,'#ff4d4d'],[13,44,'#ffd84d']].map(o=>`<circle cx="${o[0]}" cy="${o[1]}" r="1.6" fill="${o[2]}"/>`).join('');
  const flakes=Array.from({length:18},(_,i)=>`<i style="left:${(i*37+11)%100}%;animation-duration:${5+(i%4)}s;animation-delay:-${i%7}s;width:${3+(i%3)}px;height:${3+(i%3)}px"></i>`).join('');
  return `<div class="xmas" aria-hidden="true"><svg viewBox="0 0 100 95" preserveAspectRatio="xMidYMid slice">
    <path d="M-2 6Q12 14 25 8T52 8T78 8T104 8" stroke="#2c4a33" stroke-width=".6" fill="none"/>${bulbs}
    <g id="xtree"><polygon points="14,34 23,52 5,52" fill="#2f8f4e"/><polygon points="14,42 27,64 1,64" fill="#287a42"/><polygon points="14,52 31,78 -3,78" fill="#206a39"/><rect x="12" y="78" width="4" height="8" fill="#6b4226"/><path d="M14 28l1.6 3.6 3.8.4-2.9 2.6.9 3.8-3.4-2-3.4 2 .9-3.8-2.9-2.6 3.8-.4z" fill="#ffd84d"/>${orn}</g>
    <use href="#xtree" transform="translate(86 4) scale(.8)"/>
  </svg></div><div class="snow" aria-hidden="true">${flakes}</div>`;
}
function catEl(key,cls,w,left,actn,extra,id){
  return `<div class="cat ${cls}" ${id?`id="${id}"`:''} data-act="${actn}" data-key="${key}" ${extra||''} style="width:${w}%;left:${left}%"><div class="flip"><div class="pose"><img src="${CAT_SRC}" alt="고양이" width="560" height="368">${cls==='mother'?'<span class="nose" data-act="nose"></span>':''}</div></div></div>`;
}
function stageHtml(p,withMission){
  const h=HOUSES[p.house], s=petSize(p), today=dayKey(now());
  const scale=Math.min(1.35,0.8+(s.cm-20)/60);
  const w=(44*scale).toFixed(1);
  const babies=(p.babies||[]).map((b,i)=>{
    const grown=daysBetween(b.born,today)>=7;
    const k='b'+b.id; if(POS[k]==null) POS[k]=i%2?72:24;
    return catEl(k,'baby',grown?26:15,POS[k],'baby',`data-id="${b.id}"`);
  }).join('');
  const mk='m'+p.id; if(POS[mk]==null) POS[mk]=50;
  return `<div class="stage" id="stage" style="background:${h.sky}">
    <div class="ground" style="background:${h.ground}"></div>
    ${isXmas()?xmasHtml():''}
    ${withMission?`<button class="btn coin mission-btn" data-act="missions">성장미션</button>`:''}
    <div class="house">${houseSvg(p.house,p.lvl)}</div>

    ${catEl(mk,'mother',w,POS[mk],'cat','','cat')}
  </div>`;
}

/* ---------- actions ---------- */
function act(name,t,e){
  const a=DB.session?acc():null;
  if(busy && ['play','stretch','hatch','feed','build','missions','pat','go-lucky','rain','nextday','plus'].includes(name)) return;
  switch(name){
    case 'go-login': loginErr=''; setView('login'); break;
    case 'go-start': setView('start'); break;
    case 'go-sorde': sordeStep='gate'; setView('sorde'); break;
    case 'sorde-login': sordeStep='list'; render(); break;
    case 'sorde-add': sordeStep='form'; sordePrefill=''; render(); break;
    case 'sorde-pick': sordeStep='form'; sordePrefill=t.dataset.name; render(); { const pw=$('#spw'); if(pw) pw.focus(); } break;
    case 'sorde-enter': loginAs('seon'); break;
    case 'menu': openMenu(); break;
    case 'close-layer': if(e && e.target!==t) break; $('#layer').innerHTML=''; break;
    case 'close-layer-btn': $('#layer').innerHTML=''; break;
    case 'open-secret': setView('secret'); break;
    case 'open-pat2': setView('pat2'); break;
    case 'home': play=null; setView('home'); break;
    case 'logout': play=null; DB.session=null; save(); setView('start'); break;
    case 'nextday': a.offset++; save(); $('#layer').innerHTML=''; if(checkVanish()) toast('펫이 사라졌어요'); else if(checkBabies()) toast('아기 고양이가 하늘나라로 갔어요'); else toast('하루가 지났어요 (테스트)'); render(); break;
    case 'plus':
      if(a.pets.length>=MAX_PETS){ toast(`펫은 최대 ${MAX_PETS}마리까지 키울 수 있어요`); break; }
      setView('adopt-pet'); break;
    case 'pickpet': flow.pet=!flow.pet; render(); break;
    case 'pet-ok': if(flow.pet) setView('adopt-house'); break;
    case 'pickhouse': flow.house=t.dataset.k; render(); break;
    case 'house-ok': if(!flow.house) break;
      a.seq=(a.seq||0)+1;
      if(!a.pets.length){ a.lastEarn=dayKey(now()); a.vanished=false; }
      a.pets.push({id:a.seq,name:`고양이 ${a.seq}`,house:flow.house,adopted:dayKey(now()),lvl:1,plays:0,meals:0});
      sel=a.pets.length-1; flow={pet:false,house:null}; save(); setView('home'); toast('입양 완료! 잘 키워주세요'); break;
    case 'sel': sel=+t.dataset.i; play=null; render(); break;
    case 'missions': openMissions(); break;
    case 'mission': doMission(+t.dataset.i); break;
    case 'secret': if(a.secretDay!==dayKey(now())){ a.secretDay=dayKey(now()); earn(100); save(); render(); toast('비밀 포인트 100p를 받았어요'); } break;
    case 'play': startFish(); break;
    case 'stretch': doStretch(); break;
    case 'hatch': doHatch(); break;
    case 'cat': { bounceCat(); meow(1,.5); break; }
    case 'nose': { const po=$('#cat .pose'); if(po){ po.classList.remove('look'); void po.offsetWidth; po.classList.add('look'); } meow(1.15,.7); e&&e.stopPropagation(); break; }
    case 'inhouse': openHouse(); break;
    case 'baby': {
      const p=a.pets[sel]; const b=p&&(p.babies||[]).find(x=>String(x.id)===t.dataset.id); if(!b) break;
      b.cared=dayKey(now()); save(); meow(1.9,.3); openHouse(); toast('아기 고양이를 돌봐줬어요'); break; }
    case 'feed': {
      const p=a.pets[sel]; if(!p) break;
      if(!spend(FEED_COST)){ toast(`포인트가 부족해요 (${FEED_COST}p 필요)`); break; }
      p.meals++; careBabies(p); save(); updatePts(); feedAnim(); break; }
    case 'go-lucky': luckyStep=a.age25?'ball':'gate'; luckyErr=''; setView('lucky'); break;
    case 'lk': luckyStep=t.dataset.s; luckyErr=''; render(); break;
    case 'lk-yes': a.credit2=true; save(); luckyStep='credit-done'; render(); break;
    case 'ball': {
      const k=luckyKey(); if(a.luckyKey!==k){ a.luckyKey=k; a.luckyN=0; }
      if((a.luckyN|0)>=2){ toast('다음날 오후 1시부터 사용할 수 있어요'); break; }
      a.luckyN=(a.luckyN|0)+1; earn(10); ding(); render(); toast('럭키! +10p'); break; }
    case 'build': {
      const p=a.pets[sel]; if(!p||p.lvl>=3) break;
      if(!spend(HOUSE_COST)){ toast(`포인트가 부족해요 (${HOUSE_COST}p 필요)`); break; }
      p.lvl++; save(); render(); toast(`집이 Lv.${p.lvl}이 됐어요 -${HOUSE_COST}p`); break; }
    case 'pat': patAnim(); break;
    case 'rain': $('#layer').innerHTML=''; rainEvent(); break;
  }
}

/* ---------- sound ---------- */
let AC;
function audio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function meow(pitch=1,len=.6){
  const c=audio(); if(!c) return; const t=c.currentTime;
  const f=c.createBiquadFilter(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain();
  f.type='bandpass'; f.Q.value=2.5;
  f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(1900,t+len*.4); f.frequency.linearRampToValueAtTime(1000,t+len);
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.22,t+.07); g.gain.exponentialRampToValueAtTime(.0001,t+len);
  lfo.frequency.value=22; lg.gain.value=14*pitch; lfo.connect(lg);
  [1,2].forEach(m=>{ const o=c.createOscillator(); o.type=m===1?'sawtooth':'triangle';
    o.frequency.setValueAtTime(430*pitch*m,t); o.frequency.linearRampToValueAtTime(850*pitch*m,t+len*.38); o.frequency.linearRampToValueAtTime(470*pitch*m,t+len);
    lg.connect(o.frequency); o.connect(f); o.start(t); o.stop(t+len+.05); });
  f.connect(g); g.connect(c.destination); lfo.start(t); lfo.stop(t+len+.05);
}
function ding(){
  const c=audio(); if(!c) return; const t=c.currentTime;
  [[1318,0],[1760,.16]].forEach(([fr,d])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=fr;
    g.gain.setValueAtTime(.0001,t+d); g.gain.linearRampToValueAtTime(.25,t+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d+.7);
    o.connect(g); g.connect(c.destination); o.start(t+d); o.stop(t+d+.75); });
}

/* ---------- pet behavior ---------- */
let busy=false;
function openHouse(){
  const a=acc(), p=a.pets[sel]; if(!p) return; const today=dayKey(now());
  const kits=(p.babies||[]).map((b,i)=>{
    const age=daysBetween(b.born,today), since=daysBetween(b.cared,today), grown=age>=7;
    return `<button class="kit ${since>=2?'warn':''}" data-act="baby" data-id="${b.id}"><img src="${CAT_SRC}" alt="아기 고양이" width="560" height="368"><b>${grown?'다 자랐어요':'아기 고양이'} ${i+1}</b><span>태어난 지 ${age}일</span><span>${since===0?'오늘 돌봐줬어요':since+'일 동안 못 돌봤어요'}${since>=2?' · 내일 떠나요!':''}</span></button>`;
  }).join('');
  $('#layer').innerHTML=`<div class="scrim modal-wrap" data-act="close-layer"><div class="modal" role="dialog" aria-label="집 안">
    <h2 style="font-size:26px">${esc(p.name)}의 집 안</h2>
    <div class="room">${kits||'<p style="grid-column:1/-1;margin:0;color:#3a2a14;text-align:center;align-self:center">아직 아기 고양이가 없어요. 해치 버튼으로 만날 수 있어요.</p>'}</div>
    <p class="muted small" style="margin:0">아기를 눌러 돌봐주세요. 3일 동안 돌봐주지 않으면 떠나요.</p>
    <button class="btn block" data-act="close-layer-btn">닫기</button></div></div>`;
}
const careBabies=p=>{ const d=dayKey(now()); (p.babies||[]).forEach(b=>b.cared=d); };
function checkBabies(){
  const a=acc(); if(!a) return 0; const today=dayKey(now()); let n=0;
  a.pets.forEach(p=>{ p.babies=p.babies||[]; const keep=p.babies.filter(b=>daysBetween(b.cared,today)<3); n+=p.babies.length-keep.length; p.babies=keep; });
  if(n){ a.deaths=(a.deaths|0)+n; save(); }
  return n;
}
function startFish(){
  const a=acc(), p=a.pets[sel]; if(!p||busy) return;
  if(a.pts<PLAY_COST){ toast(`포인트가 부족해요 (${PLAY_COST}p 필요)`); return; }
  spend(PLAY_COST); p.plays=(p.plays|0)+1; careBabies(p); save(); updatePts();
  const st=$('#stage'), cat=$('#cat'); if(!st||!cat) return;
  busy=true;
  const pose=cat.querySelector('.pose'), flip=cat.querySelector('.flip'), mk='m'+p.id;
  const rod=document.createElement('div'); rod.className='rod'; rod.style.left=(POS[mk]??50)+'%';
  rod.innerHTML='<div class="line"></div><div class="bill">₩ 10,000</div>'; st.appendChild(rod);
  const xs=[28,70,36,64,50,30,68,44]; let i=0, last=POS[mk]??50;
  pose.classList.remove('walking'); pose.classList.add('jump'); cat.dataset.walking='1'; cat.style.transitionDuration='1.1s'; cat.style.transitionTimingFunction='ease-in-out';
  const step=()=>{
    if(i>=xs.length){ pose.classList.remove('jump'); rod.remove(); busy=false; delete cat.dataset.walking; cat.style.transitionDuration=''; toast(`신나게 놀았어요! -${PLAY_COST}p`); return; }
    const x=xs[i++]; rod.style.left=x+'%'; cat.style.left=x+'%'; POS[mk]=x;
    flip.style.transform=x<last?'scaleX(-1)':'scaleX(1)'; last=x;
    setTimeout(()=>meow(.95+Math.random()*.3,.55),650);
    setTimeout(step,1300);
  };
  rod.getBoundingClientRect(); setTimeout(step,50);
}
function doStretch(){
  const a=acc(), p=a.pets[sel]; if(!p||busy) return;
  if(a.pts<20){ toast('포인트가 부족해요 (20p 필요)'); return; }
  spend(20); updatePts(); busy=true;
  const pose=$('#cat .pose'); pose.classList.add('stretch'); meow(.7,1.2);
  setTimeout(()=>{ pose.classList.remove('stretch'); busy=false; toast('쭈우욱~ 시원해요 -20p'); },2800);
}
function doHatch(){
  const a=acc(), p=a.pets[sel]; if(!p||busy) return;
  if((a.deaths|0)>=10){ toast('해치를 더 쓸 수 없어요'); return; }
  const today=dayKey(now()); p.babies=p.babies||[];
  if(p.hatchDay!==today){ p.hatchDay=today; p.hatchN=0; }
  if((p.hatchN|0)>=2){ toast('어미가 아파요. 해치는 하루에 2번까지예요'); return; }
  if(p.babies.length>4){ toast('아기 고양이는 6마리까지 돌볼 수 있어요'); return; }
  p.hatchN=(p.hatchN|0)+1; save(); busy=true;
  const pose=$('#cat .pose'); pose.classList.add('belly'); meow(.8,.9);
  setTimeout(()=>{
    a.seq=(a.seq||0)+2;
    p.babies.push({id:a.seq-1,born:today,cared:today},{id:a.seq,born:today,cared:today});
    save(); busy=false; render(); meow(1.9,.35); setTimeout(()=>meow(2.1,.3),380); toast('아기 고양이 2마리가 태어났어요!');
  },2600);
}
const HAND_SVG='<svg viewBox="0 0 64 80"><g fill="#f3cfae" stroke="#c4906a" stroke-width="2" stroke-linejoin="round"><rect x="14" y="30" width="38" height="42" rx="14"/><rect x="14" y="8" width="9" height="34" rx="4.5"/><rect x="24.5" y="2" width="9" height="40" rx="4.5"/><rect x="35" y="6" width="9" height="36" rx="4.5"/><rect x="45" y="14" width="8" height="30" rx="4"/><rect x="3" y="40" width="9" height="26" rx="4.5" transform="rotate(-25 7 53)"/></g></svg>';
const BOWL_FOOD='<svg viewBox="0 0 80 52"><path d="M6 16Q8 48 40 48Q72 48 74 16Z" fill="#c9503a" stroke="#8c2f20" stroke-width="2"/><ellipse cx="40" cy="16" rx="34" ry="8" fill="#a5653a"/><g fill="#c98a52"><circle cx="24" cy="13" r="4"/><circle cx="36" cy="10" r="4"/><circle cx="48" cy="13" r="4"/><circle cx="58" cy="11" r="4"/><circle cx="42" cy="16" r="4"/></g></svg>';
const BOWL_WATER='<svg viewBox="0 0 80 52"><path d="M6 16Q8 48 40 48Q72 48 74 16Z" fill="#e8eef2" stroke="#9fb2bd" stroke-width="2"/><ellipse cx="40" cy="16" rx="34" ry="8" fill="#5db7ff"/><ellipse cx="34" cy="14" rx="12" ry="2.5" fill="#bfe3ff"/></svg>';
function freezeCat(cat,p){
  const st=$('#stage'), sr=st.getBoundingClientRect(), cr=cat.getBoundingClientRect();
  const x=((cr.left+cr.width/2)-sr.left)/sr.width*100;
  cat.style.transitionDuration='0s'; cat.style.left=x+'%'; POS['m'+p.id]=x; delete cat.dataset.walking;
  cat.querySelector('.pose').classList.remove('walking'); void cat.offsetWidth;
}
function patAnim(){
  const a=acc(), p=a.pets[sel]; if(!p||busy) return;
  const st=$('#stage'), cat=$('#cat'); if(!st||!cat) return;
  busy=true; careBabies(p); save(); freezeCat(cat,p);
  const sr=st.getBoundingClientRect(), cr=cat.getBoundingClientRect(), pose=cat.querySelector('.pose');
  const flipped=cat.querySelector('.flip').style.transform.includes('-1');
  const hx=cr.left-sr.left+cr.width*(flipped?.32:.68), hy=cr.top-sr.top+cr.height*.12;
  const hand=document.createElement('div'); hand.className='hand'; hand.style.left=hx+'px'; hand.style.top=hy+'px'; hand.innerHTML=HAND_SVG; st.appendChild(hand);
  requestAnimationFrame(()=>requestAnimationFrame(()=>hand.classList.add('in')));
  const bite=Math.random()<.28;
  const end=()=>{ hand.classList.remove('in','stroke','ouch'); setTimeout(()=>{ hand.remove(); pose.classList.remove('bite'); busy=false; },600); };
  setTimeout(()=>hand.classList.add('stroke'),700);
  if(!bite){
    [900,1250,1600].forEach((d,i)=>setTimeout(()=>heart(hx+(i-1)*20,hy-4),d));
    setTimeout(()=>meow(.85,.8),900); setTimeout(end,2500);
  } else {
    setTimeout(()=>{
      hand.classList.remove('stroke'); hand.classList.add('ouch'); pose.classList.add('bite'); meow(.6,.3);
      const sy=document.createElement('div'); sy.className='say'; sy.textContent='앗!'; sy.style.left=hx+'px'; sy.style.top=Math.max(8,hy-110)+'px'; st.appendChild(sy); setTimeout(()=>sy.remove(),1300);
      toast('앗! 고양이가 손을 물었어요!');
    },1000);
    setTimeout(end,2500);
  }
}
function feedAnim(){
  const a=acc(), p=a.pets[sel], st=$('#stage'), cat=$('#cat'); if(!p||!st||!cat) return;
  busy=true; freezeCat(cat,p);
  const x=POS['m'+p.id]; let bx=x+24, face=1; if(bx>84){ bx=x-24; face=-1; }
  cat.querySelector('.flip').style.transform=face>0?'scaleX(1)':'scaleX(-1)';
  const water=Math.random()<.35;
  const w=document.createElement('div'); w.className='feed'; w.style.left=bx+'%';
  w.innerHTML=`<div class="bowl">${BOWL_FOOD}<i class="kib" style="--d:.0s;--x:-10px"></i><i class="kib" style="--d:.15s;--x:2px"></i><i class="kib" style="--d:.3s;--x:14px"></i></div>${water?`<div class="bowl">${BOWL_WATER}</div>`:''}`;
  st.appendChild(w);
  const pose=cat.querySelector('.pose');
  setTimeout(()=>{ pose.classList.add('eat'); meow(1.1,.35); },1000);
  setTimeout(()=>{ pose.classList.remove('eat'); w.remove(); busy=false; toast(water?`냠냠! 서비스로 물도 마셨어요 -${FEED_COST}p`:`냠냠! 밥을 먹었어요 -${FEED_COST}p`); },3600);
}
function rainEvent(){
  const a=acc(), p=a&&a.pets[sel]; if(!p||busy||view!=='home') return;
  const st=$('#stage'); if(!st) return; busy=true;
  const r=document.createElement('div'); r.className='rain';
  r.innerHTML=Array.from({length:36},(_,i)=>`<i style="left:${(i*29+7)%100}%;animation-delay:-${(i%9)*.06}s;animation-duration:${.45+(i%4)*.07}s"></i>`).join('');
  st.appendChild(r); toast('비가 내려요…');
  let msg='집이 굴러 떨어졌어요!';
  setTimeout(()=>{
    const h=st.querySelector('.house'); if(h) h.classList.add('tumble');
    p.babies=p.babies||[];
    if(p.babies.length){ p.babies.pop(); a.deaths=(a.deaths|0)+1; save(); msg='집이 굴러 떨어져서 아기 고양이 1마리가 떠났어요'; }
    toast('앗! 집이 굴러 떨어져요!');
  },2600);
  setTimeout(()=>{ busy=false; render(); toast(msg); },5400);
}
setInterval(()=>{ if(view==='home'&&!busy&&!document.hidden&&acc()&&acc().pets.length&&Math.random()<.1) rainEvent(); },45000);

/* the cat walks to a new spot, stepping all the way, then rests */
setInterval(()=>{
  if(view!=='home'||busy||document.hidden) return;
  document.querySelectorAll('#stage .cat').forEach(el=>{
    if(el.dataset.walking||Math.random()<.3) return;
    const k=el.dataset.key, cur=POS[k]??50, nx=Math.round(20+Math.random()*60), d=Math.abs(nx-cur);
    if(d<8) return;
    const dur=d*.12, po=el.querySelector('.pose'), fl=el.querySelector('.flip');
    el.dataset.walking='1'; el.style.transitionTimingFunction='linear'; el.style.transitionDuration=dur+'s';
    if(fl) fl.style.transform=nx<cur?'scaleX(-1)':'scaleX(1)';
    po.classList.add('walking'); POS[k]=nx; el.style.left=nx+'%';
    setTimeout(()=>{ po.classList.remove('walking'); delete el.dataset.walking; },dur*1000+60);
  });
},2600);
setInterval(()=>{ if(DB.session&&acc()&&!checkVanish()&&checkBabies()){ toast('아기 고양이가 하늘나라로 갔어요'); if(view==='home') render(); } },30000);
if(DB.session&&acc()) checkBabies();

render();
</script>

</body></html>
