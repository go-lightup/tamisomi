<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>간단한 계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    .calculator {
      background-color: #202020;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 320px;
    }

    .display {
      width: 100%;
      height: 70px;
      background-color: #2b2b2b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 2rem;
      text-align: right;
      padding: 0 15px;
      margin-bottom: 20px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      font-size: 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #3b3b3b;
      color: #ffffff;
      transition: background-color 0.15s ease, transform 0.05s;
    }

    button:active {
      transform: scale(0.96);
    }

    button.operator {
      background-color: #ff9500;
      color: #ffffff;
    }

    button.operator:hover {
      background-color: #e08500;
    }

    button.function {
      background-color: #a5a5a5;
      color: #000000;
    }

    button.function:hover {
      background-color: #8e8e8e;
    }

    button:hover {
      background-color: #505050;
    }

    button.zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" class="display" value="0" readonly>
    <div class="buttons">
      <button class="function" onclick="clearDisplay()">AC</button>
      <button class="function" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="zero" onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="operator" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(val) {
      if (display.value === '0' || display.value === 'Error') {
        if (['+', '-', '*', '/', '%'].includes(val)) {
          display.value = '0' + val;
        } else {
          display.value = val;
        }
      } else {
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length === 1 || display.value === 'Error') {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        // 안전한 연산 처리를 위해 허용된 문자(숫자 및 사칙연산 기호)만 확인 후 실행
        if (/^[0-9+\-*/. %]+$/.test(display.value)) {
          display.value = Function('"use strict"; return (' + display.value + ')')();
        } else {
          display.value = 'Error';
        }
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
